version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      # If using Ollama via Docker, override the URL:
      # OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  # Optional: local Ollama service (comment out if using Anthropic API)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
